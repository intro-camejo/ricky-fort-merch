services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ricky
      POSTGRES_PASSWORD: comandante
      POSTGRES_DB: merch
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./backend/db/schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./backend/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricky -d merch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  pg-data:
