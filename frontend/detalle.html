<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFM - Detalle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="listado.html">Productos</a>
    </div>
    <div class="container" id="container-index">
        <h1>Detalle</h1>
        <h2 id="producto-nombre"></h2>
        <button id="producto-eliminar">Eliminar</button>
        <button id="producto-editar">Editar</button>
        <p id="producto-precio"></p>
        <img id="producto-imagen">
    </div>

    <dialog id="dialogo-editar">
        <form method="dialog" id="form-editar">
            <div class="formContainer" >
            <h2>
                Editar producto
            </h2>
            <div>
             <label for="nombre">nombre</label>
             <input id="nombre" name="nombre" required placeholder="Don Santur"/>
            </div>

             <div>
             <label for="precio">precio</label>
             <input type="number" id="precio" name="precio" step="0.01" required/>
            </div>

            <div>
             <label for="imagen">imagen</label>
             <input type="text" id="imagen" name="imagen" required/>
            </div>

            <button type="submit">
                Guardar
            </button>
         </div>
        </form>
    </dialog>

    <div class="footer">
        <p>En honor a <a href="https://www.infobae.com/resizer/v2/VLMJYISJTRHNJOOAGOQAN3EDFM.jpg?auth=d3f3f1488daa9e029e0d4e89626ca1251760cbf52802d9e9a3b6ae70788a471e&smart=true&width=992&height=579&quality=85" target="_blank">él</a></p>
    </div>

     <script>
        // 1. obtener el id que estoy trabajando
        const searchParams = new URLSearchParams(window.location.search);
        const id = searchParams.get("id");
        console.log(id);

        cargarDetalle();
        async function cargarDetalle(){
            // 2. pedirle al servidor info de este producto y pasarla a json
            const data = await fetch(`http://localhost:3000/products/${id}`);
            const producto = await data.json();
            console.log(producto);
            // 3. mostrar la info en el DOM
            let nombre = document.getElementById("producto-nombre");
            const inputNombre = document.getElementById("nombre");
            nombre.innerText = producto.name;
            inputNombre.value = producto.name;

            let precio = document.getElementById("producto-precio");
            const inputPrecio = document.getElementById("precio");
            precio.innerText = producto.price;
            inputPrecio.value = producto.price;

            let imagen = document.getElementById("producto-imagen");
            const inputImagen = document.getElementById("imagen");
            imagen.src = producto.image;
            inputImagen.value = producto.image;
        }

        const botonEliminar = document.getElementById("producto-eliminar");
        botonEliminar.addEventListener("click", async () => {
          const response = await fetch(
            `http://localhost:3000/products/${id}`,
            { method: "DELETE" }
          );

          if (response.ok) {
            alert("Producto eliminado");
            window.location = "/listado.html";
          } else {
            alert("Error al eliminar el producto");
          }
        });

        const botonEditar = document.getElementById("producto-editar");
        const dialogoEditar = document.getElementById("dialogo-editar");
        botonEditar.addEventListener("click", () => {
          dialogoEditar.showModal();
        });

        const formEditar = document.getElementById("form-editar");
        formEditar.addEventListener("submit", async (event) => {
          const nombre = event.target.nombre.value
          const precio = event.target.precio.value
          const imagen = event.target.imagen.value

          const response = await fetch(`http://localhost:3000/products/${id}`, {
            method: "PUT",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: nombre,
              price: precio,
              image: imagen
            })
          });

          if (response.ok) {
            alert("Producto actualizado correctamente");
            window.location.reload();
          } else {
            alert("Error al actualizar el producto, intente nuevamente");
          }
        })
     </script>
</body>
</html>
