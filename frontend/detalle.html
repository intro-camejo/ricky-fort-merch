<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFM - Detalle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="listado.html">Productos</a>
    </div>
    <div class="container" id="container-index">
        <h1>Detalle</h1>
        <h2 id="producto-nombre"></h2>
        <p id="producto-precio"></p>
        <img id="producto-imagen">
    </div>

    <div class="footer">
        <p>En honor a <a href="https://www.infobae.com/resizer/v2/VLMJYISJTRHNJOOAGOQAN3EDFM.jpg?auth=d3f3f1488daa9e029e0d4e89626ca1251760cbf52802d9e9a3b6ae70788a471e&smart=true&width=992&height=579&quality=85" target="_blank">él</a></p>
    </div>

     <script>
        cargarDetalle();
        async function cargarDetalle(){
            // 1. obtener el id que estoy trabajando
            const searchParams = new URLSearchParams(window.location.search);
            const id = searchParams.get("id");
            console.log(id);
            // 2. pedirle al servidor info de este producto y pasarla a json
            const data = await fetch(`https://intro.bilbao.ar/products/${id}`);
            const producto = await data.json();
            console.log(producto);
            // 3. mostrar la info en el DOM
            let nombre = document.getElementById("producto-nombre");
            nombre.innerText = producto.name;
            let precio = document.getElementById("producto-precio");
            precio.innerText = producto.price;
            let imagen = document.getElementById("producto-imagen");
            imagen.src = producto.image;
        }
        
     </script>
</body>
</html>
