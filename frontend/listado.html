<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFM - Listado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="listado.html" class="active">Productos</a>
    </div>
    <div class="container">
        <div class="row">
            <h1>Listado</h1>
            <button onclick="abrirModalDeCarga()"> + </button>
        </div>
        <div class="card-list" id="productos"></div>
    </div>

    <div class="footer">
        <p>En honor a <a href="https://www.infobae.com/resizer/v2/VLMJYISJTRHNJOOAGOQAN3EDFM.jpg?auth=d3f3f1488daa9e029e0d4e89626ca1251760cbf52802d9e9a3b6ae70788a471e&smart=true&width=992&height=579&quality=85" target="_blank">él</a></p>
    </div>


    <dialog id="modalDeCarga">
        <form method="dialog" id="formDeCarga">
            <div class="formContainer" >
            <h2>
                Ingrese producto
            </h2>
            <div>
             <label for="nombre">nombre</label>
             <input id="nombre" name="nombre" required placeholder="Don Santur"/>
            </div>

             <div>
             <label for="precio">precio</label>
             <input type="number" id="precio" name="Nombre" required/>
            </div>

            <div>
             <label for="imagen">imagen</label>
             <input type="text" id="imagen" name="imagen" required/>
            </div>

            <button type="submit">
                Guardar
            </button>
         </div>
        </form>
    </dialog>

    <dialog id="loader">
        <h2>
            Cargando...
        </h2>
        <image src="https://media.tenor.com/On7kvXhzml4AAAAj/loading-gif.gif" alt="Cargando..."/>
    </dialog>


    <script src="scripts.js"></script>
</body>
</html>
